<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercícios — Códigos Executáveis</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#111;color:#f5f5f5;font-family:Arial,sans-serif;margin:0;line-height:1.5}
main{max-width:780px;margin:0 auto;padding:16px}
h1{color:gold}
h2{color:gold;border-bottom:1px solid #333;padding-bottom:6px;margin-top:40px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:14px;margin:16px 0}
.instr{color:#ccc;margin:0 0 10px}
pre{background:#0a0a0a;color:#f5f5f5;padding:10px;border-radius:6px;overflow-x:auto;font-size:13px;margin:10px 0 0;display:none}
pre.show{display:block}
.reveal{background:none;border:none;color:#666;font-size:12px;cursor:pointer;padding:4px 0;margin-top:4px;text-align:left;display:block}
.reveal:hover{color:#999}
input{padding:8px;border-radius:6px;border:1px solid #333;background:#111;color:#f5f5f5;width:100%;box-sizing:border-box;margin-bottom:8px}
button{background:gold;color:#111;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold}
button:hover{background:orange}
.out{margin-top:8px;font-weight:bold;color:gold;min-height:1.2em}
.out.err{color:#ff6b6b}
.out p{margin:2px 0}
</style>
</head>
<body>
<main>
<h1>Exercícios — Códigos Executáveis</h1>
<div id="root"></div>
</main>

<script>
const lista = s => s.split(',').map(x => x.trim()).filter(Boolean);
const nums = s => {
  const a = lista(s).map(Number);
  if (!a.length || a.some(isNaN)) throw new Error('Digite apenas números separados por vírgula.');
  return a;
};
const brl = n => 'R$ ' + n.toFixed(2).replace('.', ',');

const PARTES = [
{ t: 'filter()', ex: [
 { t: 'Idades maiores de idade', instr: 'Digite idades separadas por vírgula e clique em Executar.', ph: 'Ex.: 12, 18, 25, 40',
   code: `const maiores = idades.filter(idade => idade >= 18);`,
   run: (v, out) => { const r = nums(v).filter(i => i >= 18); out.textContent = r.length ? `Maiores de idade: ${r.join(', ')}` : 'Ninguém é maior de idade.'; } },
 { t: 'Números pares', instr: 'Digite números separados por vírgula e clique em Executar.', ph: 'Ex.: 1, 2, 3, 4, 5, 6',
   code: `const pares = numeros.filter(n => n % 2 === 0);`,
   run: (v, out) => { const r = nums(v).filter(n => n % 2 === 0); out.textContent = r.length ? `Números pares: ${r.join(', ')}` : 'Nenhum número par.'; } },
 { t: 'Nomes que começam com "A"', instr: 'Digite nomes separados por vírgula e clique em Executar.', ph: 'Ex.: Ana, Bruno, alice, Carlos',
   code: `const comA = nomes.filter(n => n.toLowerCase().startsWith('a'));`,
   run: (v, out) => { const r = lista(v).filter(n => n.toLowerCase().startsWith('a')); out.textContent = r.length ? `Nomes com A: ${r.join(', ')}` : 'Nenhum nome começa com A.'; } },
 { t: 'Notas maiores ou iguais a 7', instr: 'Digite notas separadas por vírgula e clique em Executar.', ph: 'Ex.: 5, 7, 8.5, 6.9, 10',
   code: `const aprovadas = notas.filter(nota => nota >= 7);`,
   run: (v, out) => { const r = nums(v).filter(n => n >= 7); out.textContent = r.length ? `Notas ≥ 7: ${r.join(', ')}` : 'Nenhuma nota ≥ 7.'; } },
 { t: 'Múltiplos de 3', instr: 'Digite números separados por vírgula e clique em Executar.', ph: 'Ex.: 3, 4, 6, 9, 10, 12',
   code: `const mult3 = numeros.filter(n => n % 3 === 0);`,
   run: (v, out) => { const r = nums(v).filter(n => n % 3 === 0); out.textContent = r.length ? `Múltiplos de 3: ${r.join(', ')}` : 'Nenhum múltiplo de 3.'; } }
]},
{ t: 'find()', ex: [
 { t: 'Encontrar "maçã"', instr: 'Digite frutas separadas por vírgula e clique em Executar.', ph: 'Ex.: banana, uva, Maçã, pera',
   code: `const fruta = frutas.find(f => f === 'maçã');`,
   run: (v, out) => { const f = lista(v).map(x => x.toLowerCase()).find(x => x === 'maçã'); out.textContent = f !== undefined ? `A primeira maçã encontrada é: ${f}` : 'Nenhuma maçã encontrada.'; } },
 { t: 'Primeiro nome com mais de 5 letras', instr: 'Digite nomes separados por vírgula e clique em Executar.', ph: 'Ex.: Ana, João, Fernanda, Gabriel',
   code: `const nome = nomes.find(n => n.length > 5);`,
   run: (v, out) => { const n = lista(v).find(x => x.length > 5); out.textContent = n !== undefined ? `Primeiro nome com mais de 5 letras: ${n}` : 'Nenhum nome com mais de 5 letras encontrado.'; } },
 { t: 'Primeiro número negativo', instr: 'Digite números separados por vírgula e clique em Executar.', ph: 'Ex.: 4, 7, -3, 9, -8',
   code: `const negativo = numeros.find(n => n < 0);`,
   run: (v, out) => { const n = nums(v).find(x => x < 0); out.textContent = n !== undefined ? `Primeiro negativo: ${n}` : 'Nenhum número negativo.'; } },
 { t: 'Primeiro preço acima de 100', instr: 'Digite preços separados por vírgula (use ponto para decimais) e clique em Executar.', ph: 'Ex.: 49.9, 80, 120, 250',
   code: `const preco = precos.find(p => p > 100);`,
   run: (v, out) => { const p = nums(v).find(x => x > 100); out.textContent = p !== undefined ? `Primeiro preço acima de 100: ${brl(p)}` : 'Nenhum preço acima de 100.'; } },
 { t: 'Primeira palavra com "z"', instr: 'Digite palavras separadas por vírgula e clique em Executar.', ph: 'Ex.: casa, bola, azul, zebra',
   code: `const palavra = palavras.find(p => p.toLowerCase().includes('z'));`,
   run: (v, out) => { const w = lista(v).find(x => x.toLowerCase().includes('z')); out.textContent = w !== undefined ? `Primeira palavra com z: ${w}` : 'Nenhuma palavra com z.'; } }
]},
{ t: 'reduce()', ex: [
 { t: 'Somar números', instr: 'Digite números separados por vírgula e clique em Executar.', ph: 'Ex.: 10, 20, 30',
   code: `const soma = numeros.reduce((acc, atual) => acc + atual, 0);`,
   run: (v, out) => { out.textContent = `Soma total: ${nums(v).reduce((a, b) => a + b, 0)}`; } },
 { t: 'Total da compra', instr: 'Digite preços separados por vírgula (use ponto para decimais) e clique em Executar.', ph: 'Ex.: 19.90, 5.5, 32',
   code: `const total = precos.reduce((acc, atual) => acc + atual, 0);`,
   run: (v, out) => { out.textContent = `Total da compra: ${brl(nums(v).reduce((a, b) => a + b, 0))}`; } },
 { t: 'Média das idades', instr: 'Digite idades separadas por vírgula e clique em Executar.', ph: 'Ex.: 15, 20, 25, 30',
   code: `const soma = idades.reduce((acc, atual) => acc + atual, 0);\nconst media = soma / idades.length;`,
   run: (v, out) => { const a = nums(v); out.textContent = `Média: ${(a.reduce((x, y) => x + y, 0) / a.length).toFixed(2)}`; } },
 { t: 'Produto de todos os números', instr: 'Digite números separados por vírgula e clique em Executar.', ph: 'Ex.: 2, 3, 4',
   code: `const produto = numeros.reduce((acc, atual) => acc * atual, 1);`,
   run: (v, out) => { out.textContent = `Produto: ${nums(v).reduce((a, b) => a * b, 1)}`; } },
 { t: 'Juntar nomes em uma string', instr: 'Digite nomes separados por vírgula e clique em Executar.', ph: 'Ex.: Ana, Bruno, Carla',
   code: `const texto = nomes.reduce((acc, nome) => acc ? acc + ', ' + nome : nome, '');`,
   run: (v, out) => { const t = lista(v).reduce((a, n) => a ? a + ', ' + n : n, ''); out.textContent = t ? `Nomes: ${t}` : 'Digite ao menos um nome.'; } }
]},
{ t: 'forEach()', ex: [
 { t: 'Saudação para cada nome', instr: 'Digite nomes separados por vírgula e clique em Executar.', ph: 'Ex.: Ana, Bruno, Carla',
   code: `nomes.forEach(nome => {\n  const p = document.createElement('p');\n  p.textContent = 'Olá, ' + nome + '!';\n  resultado.appendChild(p);\n});`,
   run: (v, out) => { out.textContent = ''; lista(v).forEach(n => { const p = document.createElement('p'); p.textContent = `Olá, ${n}!`; out.appendChild(p); }); } },
 { t: 'Dobro de cada número', instr: 'Digite números separados por vírgula e clique em Executar.', ph: 'Ex.: 1, 2, 3',
   code: `numeros.forEach(num => {\n  const p = document.createElement('p');\n  p.textContent = num + ' x 2 = ' + (num * 2);\n  resultado.appendChild(p);\n});`,
   run: (v, out) => { out.textContent = ''; nums(v).forEach(n => { const p = document.createElement('p'); p.textContent = `${n} x 2 = ${n * 2}`; out.appendChild(p); }); } },
 { t: '"Eu gosto de [fruta]"', instr: 'Digite frutas separadas por vírgula e clique em Executar.', ph: 'Ex.: manga, uva, pera',
   code: `frutas.forEach(fruta => {\n  const p = document.createElement('p');\n  p.textContent = 'Eu gosto de ' + fruta;\n  resultado.appendChild(p);\n});`,
   run: (v, out) => { out.textContent = ''; lista(v).forEach(f => { const p = document.createElement('p'); p.textContent = `Eu gosto de ${f}`; out.appendChild(p); }); } },
 { t: 'Preço com desconto (10%)', instr: 'Digite preços separados por vírgula (use ponto para decimais) e clique em Executar.', ph: 'Ex.: 100, 59.9, 20',
   code: `precos.forEach(preco => {\n  const p = document.createElement('p');\n  p.textContent = 'Preço com desconto: ' + (preco * 0.9);\n  resultado.appendChild(p);\n});`,
   run: (v, out) => { out.textContent = ''; nums(v).forEach(p0 => { const p = document.createElement('p'); p.textContent = `${brl(p0)} → Preço com desconto: ${brl(p0 * 0.9)}`; out.appendChild(p); }); } },
 { t: 'Aprovado ou Reprovado (média 7)', instr: 'Digite notas separadas por vírgula e clique em Executar.', ph: 'Ex.: 5, 7, 8.5, 6.9',
   code: `notas.forEach(nota => {\n  const p = document.createElement('p');\n  p.textContent = nota >= 7 ? 'Aprovado' : 'Reprovado';\n  resultado.appendChild(p);\n});`,
   run: (v, out) => { out.textContent = ''; nums(v).forEach(n => { const p = document.createElement('p'); p.textContent = `Nota ${n}: ${n >= 7 ? 'Aprovado' : 'Reprovado'}`; out.appendChild(p); }); } }
]}
];

const root = document.getElementById('root');
PARTES.forEach(p => {
  const h = document.createElement('h2'); h.textContent = p.t; root.appendChild(h);
  p.ex.forEach(e => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<p class="instr"><b>${e.t}.</b> ${e.instr}</p><input type="text" aria-label="entrada"><button type="button" class="run">Executar</button><span class="reveal" role="button" tabindex="0">ver código</span><div class="out"></div><pre></pre>`;
    c.querySelector('pre').textContent = e.code;
    const inp = c.querySelector('input'), out = c.querySelector('.out'), pre = c.querySelector('pre'), revealBtn = c.querySelector('.reveal');
    inp.placeholder = e.ph;
    const go = () => {
      out.className = 'out';
      try { e.run(inp.value, out); }
      catch (err) { out.className = 'out err'; out.textContent = err.message; }
    };
    c.querySelector('.run').addEventListener('click', go);
    inp.addEventListener('keydown', k => { if (k.key === 'Enter') go(); });
    const toggle = () => {
      pre.classList.toggle('show');
      revealBtn.textContent = pre.classList.contains('show') ? 'esconder código' : 'ver código';
    };
    revealBtn.addEventListener('click', toggle);
    revealBtn.addEventListener('keydown', k => { if (k.key === 'Enter') toggle(); });
    root.appendChild(c);
  });
});
</script>
</body>
</html>
